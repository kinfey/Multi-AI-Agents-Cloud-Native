---
apiVersion: v1
kind: Service
metadata:
  name: byot-requirements
  namespace: agents
  labels:
    app.kubernetes.io/part-of: byot
    byot.role: requirements
spec:
  type: LoadBalancer
  selector:
    app: byot-requirements
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: byot-code
  namespace: agents
  labels:
    app.kubernetes.io/part-of: byot
    byot.role: code
spec:
  type: LoadBalancer
  selector:
    app: byot-code
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: byot-test
  namespace: agents
  labels:
    app.kubernetes.io/part-of: byot
    byot.role: test
spec:
  type: LoadBalancer
  selector:
    app: byot-test
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: byot-deploy
  namespace: agents
