# Workload Identity service account.
# The agent uses `DefaultAzureCredential`, which on AKS picks up the
# federated token projected into the pod by the Workload Identity webhook.
#
# Pre-requisites (run once, outside the cluster):
#
#   az identity create -g $RG -n podcast-pipeline-uami
#   PRINCIPAL_ID=$(az identity show -g $RG -n podcast-pipeline-uami --query principalId -o tsv)
#   CLIENT_ID=$(az identity show -g $RG -n podcast-pipeline-uami --query clientId  -o tsv)
#
#   # Foundry project access. "Azure AI Developer" + "Cognitive Services User"
#   # on the Foundry account ARM ID is the minimum that lets `FoundryChatClient`
#   # call the deployment.
#   az role assignment create --assignee-object-id $PRINCIPAL_ID \
#       --assignee-principal-type ServicePrincipal \
#       --role "Azure AI Developer" \
#       --scope <FOUNDRY_ACCOUNT_RESOURCE_ID>
#   az role assignment create --assignee-object-id $PRINCIPAL_ID \
#       --assignee-principal-type ServicePrincipal \
#       --role "Cognitive Services User" \
#       --scope <FOUNDRY_ACCOUNT_RESOURCE_ID>
#
#   # Blob Storage write access for the generated podcast scripts.
#   az role assignment create --assignee-object-id $PRINCIPAL_ID \
#       --assignee-principal-type ServicePrincipal \
#       --role "Storage Blob Data Contributor" \
#       --scope <STORAGE_ACCOUNT_RESOURCE_ID>
#
#   # Federated credential bound to this service account.
#   ISSUER=$(az aks show -g $RG -n $AKS --query oidcIssuerProfile.issuerUrl -o tsv)
#   az identity federated-credential create \
#       -g $RG -n podcast-pipeline-fic --identity-name podcast-pipeline-uami \
#       --issuer $ISSUER \
#       --subject system:serviceaccount:podcast-pipeline:podcast-pipeline \
#       --audiences api://AzureADTokenExchange
#
# Then patch the annotation below with $CLIENT_ID and apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: podcast-pipeline
  namespace: podcast-pipeline
  labels:
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "888dff8b-0ff9-4636-a811-2272f5b6ca79"
automountServiceAccountToken: false
