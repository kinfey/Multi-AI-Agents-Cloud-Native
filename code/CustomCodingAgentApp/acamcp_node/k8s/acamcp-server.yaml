# acamcp_node MCP server (streamable HTTP at /mcp).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acamcp-server
  namespace: openclaw
  labels:
    app.kubernetes.io/name: acamcp-server
    app.kubernetes.io/part-of: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acamcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acamcp-server
        app.kubernetes.io/part-of: openclaw
    spec:
      containers:
        - name: mcp
          image: __MCP_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8000"
            # The OpenClaw gateway (acasbxapp_node) runs in-cluster on AKS.
            - name: OPENCLAW_GATEWAY_URL
              value: "http://acasbxapp-gateway:18789"
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: acamcp-gateway
                  key: gateway-token
            # The deployment agent performs a real ACA build+deploy inside the
            # sandbox, which can take many minutes; keep this well under the
            # ingress proxy-read-timeout (3600s) but large enough to not abort
            # a slow deployment stage.
            - name: GATEWAY_TIMEOUT_SECONDS
              value: "1800"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: acamcp-server
  namespace: openclaw
  labels:
    app.kubernetes.io/name: acamcp-server
    app.kubernetes.io/part-of: openclaw
spec:
  selector:
    app.kubernetes.io/name: acamcp-server
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
