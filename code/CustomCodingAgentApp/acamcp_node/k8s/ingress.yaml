# Public ingress for the MCP server, using the AKS application routing add-on
# (managed NGINX). Enable it once per cluster:
#   az aks approuting enable -g <RESOURCE_GROUP> -n <CLUSTER_NAME>
#
# Security:
#   * TLS is issued automatically by cert-manager + Let's Encrypt (HTTP-01).
#     Install cert-manager and the ClusterIssuer first (see k8s/tls/).
#   * HTTP Basic authentication is enforced via the `acamcp-basic-auth` secret
#     (created by deploy-aks.sh from MCP_BASIC_AUTH_USER / MCP_BASIC_AUTH_PASSWORD).
#
# MCP_HOST must resolve to the ingress controller's public IP. A nip.io host
# such as <ingress-ip>.nip.io works without any DNS setup.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acamcp-server
  namespace: openclaw
  labels:
    app.kubernetes.io/name: acamcp-server
    app.kubernetes.io/part-of: openclaw
  annotations:
    # MCP streamable HTTP keeps long-lived responses; raise proxy timeouts.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Redirect plain HTTP to HTTPS once the certificate is ready.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Automatic TLS certificate from Let's Encrypt via cert-manager.
    cert-manager.io/cluster-issuer: "__CERT_ISSUER__"
    # HTTP Basic authentication (htpasswd secret with an `auth` key).
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: acamcp-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication required to access the MCP server"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - __MCP_HOST__
      secretName: acamcp-server-tls
  rules:
    - host: __MCP_HOST__
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: acamcp-server
                port:
                  number: 80
