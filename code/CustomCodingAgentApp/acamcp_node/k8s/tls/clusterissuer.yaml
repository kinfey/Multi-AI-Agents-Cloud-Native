# Let's Encrypt ClusterIssuer for the MCP ingress.
#
# Prerequisite: cert-manager must be installed in the cluster, e.g.
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.3/cert-manager.yaml
#
# The HTTP-01 challenge is solved through the AKS application-routing (managed
# NGINX) ingress controller, so the MCP host must resolve to that controller's
# public IP (a nip.io host such as <ingress-ip>.nip.io works out of the box).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: kinfeylo@microsoft.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: webapprouting.kubernetes.azure.com
