name: skill-eval-business-agent-deepseek
description: >
  Foundry Hosted Agent for skill-eval business SUT using DeepSeek-V4-Pro and
  the edu-video-script Foundry Skill.
metadata:
  tags:
    - Agent Framework
    - Skill Evaluation
    - Responses Protocol
    - Foundry Skills
template:
  name: skill-eval-business-agent-deepseek
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{MODEL_DEEPSEEK}}"
parameters:
  properties:
    - name: MODEL_DEEPSEEK
      secret: false
      description: Foundry model deployment name for DeepSeek.
resources:
  - kind: model
    id: DeepSeek-V4-Pro
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
