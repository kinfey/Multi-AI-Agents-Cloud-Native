name: skill-eval-business-agent-gpt
description: >
  Foundry Hosted Agent for skill-eval business SUT using gpt-5.5 and
  the edu-video-script Foundry Skill.
metadata:
  tags:
    - Agent Framework
    - Skill Evaluation
    - Responses Protocol
    - Foundry Skills
template:
  name: skill-eval-business-agent-gpt
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{MODEL_GPT}}"
parameters:
  properties:
    - name: MODEL_GPT
      secret: false
      description: Foundry model deployment name for GPT.
resources:
  - kind: model
    id: gpt-5.5
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
