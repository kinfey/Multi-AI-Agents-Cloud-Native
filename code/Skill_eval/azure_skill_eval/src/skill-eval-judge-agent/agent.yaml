# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: skill-eval-judge-agent
description: |
    Foundry Hosted Agent that grades skill-eval outputs with the rubric JSON contract.
metadata:
    tags:
        - Agent Framework
        - Skill Evaluation
        - Judge
        - Responses Protocol
protocols:
    - protocol: responses
      version: 1.0.0
resources:
    cpu: "0.5"
    memory: 1Gi
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-5.5