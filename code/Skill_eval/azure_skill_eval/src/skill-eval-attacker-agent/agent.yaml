# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: skill-eval-attacker-agent
description: |
    Foundry Hosted Agent that crafts adversarial format-drift prompts for skill-eval.
metadata:
    tags:
        - Agent Framework
        - Skill Evaluation
        - Attacker
        - Responses Protocol
protocols:
    - protocol: responses
      version: 1.0.0
resources:
    cpu: "0.5"
    memory: 1Gi
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-5.5