apiVersion: kars.azure.com/v1alpha1
kind: InferencePolicy
metadata:
  name: media-claw-inference
  namespace: finance-media
spec:
  appliesTo:
    sandboxName: media-claw-agent
    action: "*"
  modelPreference:
    primary:
      provider: azure-openai
      deployment: gpt-5.5
  tokenBudget:
    perRequestTokens: 8192
    dailyTokens: 200000
    monthlyTokens: 5000000
  contentSafety:
    hate: Medium
    selfHarm: Low
    sexual: Medium
    violence: Medium
    requirePromptShields: true
---
