[project]
name = "kars-finance-shortvideo"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["agents"]
pythonpath = ["agents/media-claw-agent/src", "agents/media-app-agent/src", "agents/media-testing-agent/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
